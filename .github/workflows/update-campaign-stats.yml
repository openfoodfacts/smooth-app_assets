name: Update Campaign Stats

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Measure and update campaign stats
        run: |
          python scripts/measure_campaign_stats.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ release-website/photos-for-impact/
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: update Photos for Impact campaign stats'
            git push
          fi
