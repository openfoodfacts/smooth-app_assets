<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Data Detective...</title>
    <script>
        const currentUrl = new URL(window.location.href);
        const target = new URL("../data-detective/", window.location.href);
        for (const [key, val] of currentUrl.searchParams.entries()) {
            target.searchParams.set(key, val);
        }
        window.location.replace(target.href);
    </script>
</head>
<body>
    <p>Redirecting to <a href="../data-detective/">Data Detective</a>...</p>
</body>
</html>
